openapi: 3.0.0
info:
  title: DigitalStore API
  description: API REST para loja virtual
  version: 1.0.0
  contact:
    name: DigitalStore Team
    email: team@digitalstore.com

servers:
  - url: http://localhost:3000/api
    description: Development server
  - url: http://localhost:3000/v1
    description: Version 1 API

paths:
  /health:
    get:
      summary: Health Check
      description: Verifica o status do serviço
      operationId: healthCheck
      tags:
        - Health
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: OK
                  timestamp:
                    type: string
                    format: date-time
                    example: '2024-01-01T00:00:00Z'
                  service:
                    type: string
                    example: DigitalStore API
        '500':
          description: Erro interno

  /v1/user/token:
    post:
      summary: Gera token JWT
      description: Autentica usuário e gera token JWT
      operationId: generateToken
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: 'user@mail.com'
                password:
                  type: string
                  format: password
                  example: '123@123'
      responses:
        '200':
          description: Token gerado com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
        '400':
          description: Erro de validação ou credenciais inválidas
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Invalid email or password'

  /users:
    get:
      summary: Lista todos os usuários
      description: Retorna uma lista de usuários
      operationId: listUsers
      tags:
        - Users
      responses:
        '200':
          description: Lista de usuários
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '500':
          description: Erro interno

    post:
      summary: Cria um novo usuário
      description: Adiciona um novo usuário ao sistema
      operationId: createUser
      tags:
        - Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInput'
      responses:
        '201':
          description: Usuário criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Erro de validação
        '500':
          description: Erro interno

  /users/{id}:
    get:
      summary: Lista um usuário específico
      description: Retorna os dados de um usuário pelo ID
      operationId: getUser
      tags:
        - Users
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: Usuário encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: Usuário não encontrado
        '500':
          description: Erro interno

    put:
      summary: Atualiza um usuário
      description: Atualiza os dados de um usuário pelo ID
      operationId: updateUser
      tags:
        - Users
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInput'
      responses:
        '200':
          description: Usuário atualizado
        '400':
          description: Erro de validação
        '401':
          description: Não autorizado
        '404':
          description: Usuário não encontrado
        '500':
          description: Erro interno

    delete:
      summary: Deleta um usuário
      description: Remove um usuário pelo ID
      operationId: deleteUser
      tags:
        - Users
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 1
      responses:
        '204':
          description: Usuário deletado com sucesso
        '401':
          description: Não autorizado
        '404':
          description: Usuário não encontrado
        '500':
          description: Erro interno

  /products:
    get:
      summary: Lista todos os produtos
      description: Retorna uma lista paginada de produtos ativos
      operationId: listProducts
      tags:
        - Products
      parameters:
        - name: page
          in: query
          description: Número da página
          required: false
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          description: Quantidade de itens por página
          required: false
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Lista de produtos
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Product'
                  pagination:
                    type: object
                    properties:
                      total:
                        type: integer
                      page:
                        type: integer
                      limit:
                        type: integer
                      totalPages:
                        type: integer
        '500':
          description: Erro interno

    post:
      summary: Cria um novo produto
      description: Adiciona um novo produto ao estoque
      operationId: createProduct
      tags:
        - Products
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
      responses:
        '201':
          description: Produto criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          description: Erro de validação
        '500':
          description: Erro interno

security: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      required:
        - firstname
        - surname
        - email
        - password
      properties:
        id:
          type: integer
          example: 1
        firstname:
          type: string
          example: 'João'
        surname:
          type: string
          example: 'Silva'
        email:
          type: string
          format: email
          example: 'joao@exemplo.com'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    UserInput:
      type: object
      required:
        - firstname
        - surname
        - email
        - password
      properties:
        firstname:
          type: string
          minLength: 2
          maxLength: 100
          example: 'João'
        surname:
          type: string
          minLength: 2
          maxLength: 100
          example: 'Silva'
        email:
          type: string
          format: email
          minLength: 5
          maxLength: 255
          example: 'joao@exemplo.com'
        password:
          type: string
          minLength: 6
          maxLength: 255
          example: 'senha123'

    Product:
      type: object
      required:
        - name
        - description
        - price
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: 'Produto Exemplo'
        description:
          type: string
          example: 'Descrição do produto'
        price:
          type: number
          format: double
          example: 99.99
        stock:
          type: integer
          example: 100
        active:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ProductInput:
      type: object
      required:
        - name
        - description
        - price
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 100
          example: 'Produto Exemplo'
        description:
          type: string
          minLength: 10
          example: 'Descrição detalhada do produto'
        price:
          type: number
          minimum: 0
          example: 99.99
        stock:
          type: integer
          minimum: 0
          default: 0
          example: 100
