services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: digitalstore-api
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DATABASE_HOST=mysql
      - DATABASE_PORT=3306
      - DATABASE_NAME=digitalstore
      - DATABASE_USER=root
      - DATABASE_PASSWORD=rootpassword
    depends_on:
      - mysql
    volumes:
      - .:/app
      - /app/node_modules
      - /app/dist
    command: npm run dev

  mysql:
    image: mysql:8.0
    container_name: digitalstore-mysql
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword
      - MYSQL_DATABASE=digitalstore
      - MYSQL_PASSWORD=rootpassword
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d

volumes:
  mysql_data:
